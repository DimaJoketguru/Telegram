name: Build Telegram Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Telegram source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build Telegram Docker image
        run: docker build -t telegram-android-builder .

      - name: Compile APK
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/source" \
            telegram-android-builder

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
